<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PLC凉皮杯 - 海选排行榜</title>

  <link rel="icon" type="image/png" href="./assets/logo1.png" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

<div class="overlay"></div>

<canvas id="particles"></canvas>

<header class="hero">
  <h1>PLC凉皮杯</h1>

  <p>海选排行榜</p>

  <div id="countdown" class="countdown">
    距离海选截止：计算中...
  </div>
</header>

<section class="top3" id="top3"></section>

<section class="ranking">
  <div class="ranking-header">
    <span>排名</span>
    <span>选手</span>
    <span>成绩</span>
  </div>

  <div id="rankingList"></div>
</section>

<footer>
  <div id="updateTime"></div>

  <div class="tip">
    点击单条成绩即可查看或发布评论
  </div>

  <div class="copyright">
    © 2026 PLC凉皮杯赛事委员会
  </div>

  <div class="loading-note">
    加载排行数据需要10秒左右时间，首次进入请耐心等待。
  </div>
</footer>

<div class="comment-modal" id="commentModal">
  <div class="comment-box">

    <button class="close-btn" onclick="closeComments()">×</button>

    <h2 id="commentTitle">成绩排行评论</h2>

    <div id="commentList"></div>

    <input id="commentNickname" placeholder="请输入昵称">

    <textarea
      id="commentContent"
      placeholder="写下你的评论"
    ></textarea>

    <button
      class="submit-comment-btn"
      onclick="submitComment()"
    >
      发布评论
    </button>

  </div>
</div>

<script src="./js/api.js"></script>
<script src="./js/particles.js"></script>
<script src="./js/app.js"></script>

</body>
</html>
