<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PLC凉皮杯比赛曲库，按赛事主页选曲规则整理。" />

  <title>PLC凉皮杯 - 比赛曲库</title>

  <link rel="preload" href="./assets/fonts/Phi.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./assets/bg.webp" as="image" />
  <link rel="icon" type="image/png" href="./assets/favicon-96.png" />
  <link rel="stylesheet" href="./css/song-pool.css" />
  <link rel="stylesheet" href="./css/account-link.css?v=20260701b" />
  <link rel="stylesheet" href="./css/site-announcement.css" />
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>

  <header class="pool-header">
    <a class="pool-brand" href="./event" aria-label="返回赛事主页">
      <img src="./assets/logo2-160.webp" width="42" height="42" alt="" aria-hidden="true" decoding="async" />
      <strong>PLC凉皮杯</strong>
    </a>

    <nav class="pool-nav" aria-label="曲库页面导航">
      <a href="./event">赛事主页</a>
      <a href="./schedule">在线赛程</a>
      <a href="./">海选榜</a>
    </nav>

    <a class="plc-account-link" href="./user" data-plc-account-link>
      <span class="plc-account-label">账号</span>
      <strong class="plc-account-name" data-plc-account-name>未登录</strong>
    </a>
  </header>

  <main class="pool-page">
    <section class="pool-workbench" aria-labelledby="poolTitle">
      <div class="pool-title-block">
        <p class="eyebrow">PLC Song Pool</p>
        <h1 id="poolTitle">比赛曲库</h1>
        <p class="pool-source" id="poolSource">读取曲库中...</p>
      </div>

      <div class="pool-rule-panel" aria-label="当前规则">
        <span id="activeStageName">16进8阶段</span>
        <strong id="activeStageCount">0 首</strong>
      </div>

      <div class="pool-controls" aria-label="曲库筛选">
        <div class="stage-tabs" role="tablist" aria-label="比赛阶段">
          <button class="is-active" type="button" role="tab" aria-selected="true" data-stage="round16">16进8</button>
          <button type="button" role="tab" aria-selected="false" data-stage="top8">8强赛</button>
        </div>

        <label class="search-box" for="poolSearch">
          <span>搜索</span>
          <input id="poolSearch" type="search" autocomplete="off" placeholder="曲名 / 曲包" />
        </label>

        <label class="select-box" for="difficultyFilter">
          <span>难度</span>
          <select id="difficultyFilter">
            <option value="all">全部</option>
            <option value="IN">IN</option>
            <option value="EZ HD IN">EZ HD IN</option>
          </select>
        </label>

        <label class="select-box" for="packFilter">
          <span>曲包</span>
          <select id="packFilter">
            <option value="all">全部曲包</option>
          </select>
        </label>

        <label class="select-box" for="sortBy">
          <span>排序</span>
          <select id="sortBy">
            <option value="version">版本</option>
            <option value="likes">赞数</option>
          </select>
        </label>

        <label class="select-box" for="sortOrder">
          <span>顺序</span>
          <select id="sortOrder">
            <option value="asc">正序</option>
            <option value="desc">倒序</option>
          </select>
        </label>
      </div>
    </section>

    <section class="track-grid" id="trackGrid" aria-live="polite"></section>

    <p class="empty-state" id="emptyState" hidden>没有找到符合条件的曲目。</p>
  </main>

  <div class="track-overview" id="trackOverview" hidden>
    <section class="track-overview-panel" role="dialog" aria-modal="true" aria-labelledby="overviewTitle">
      <button class="overview-close" id="overviewClose" type="button" aria-label="关闭总览">×</button>

      <div class="overview-detail">
        <p class="overview-kicker" id="overviewStage">16进8</p>
        <h2 id="overviewTitle"></h2>

        <div class="overview-stats" aria-label="曲目统计">
          <span>总赞数</span>
          <strong id="overviewLikes">0</strong>
        </div>

        <div class="overview-difficulty">
          <span>难度</span>
          <strong id="overviewDifficulty"></strong>
        </div>

        <button class="overview-like-button" id="overviewLikeButton" type="button">
          <span>赞</span>
          <strong id="overviewLikeCount">0</strong>
        </button>

        <p class="overview-like-note" id="overviewLikeNote">每个用户每首曲目每个阶段可赞一次。</p>
      </div>

      <div class="overview-comments">
        <div class="comment-header">
          <span>精选评论</span>
          <strong id="overviewCommentCount">0</strong>
        </div>

        <div class="song-comment-list" id="songCommentList" aria-live="polite"></div>

        <form class="song-comment-form" id="songCommentForm">
          <div class="reply-target" id="songReplyTarget" hidden>
            <span id="songReplyText"></span>
            <button id="clearSongReply" type="button">取消回复</button>
          </div>

          <div class="comment-form-row">
            <label for="songCommentNickname">
              <span>昵称</span>
              <input id="songCommentNickname" type="text" maxlength="32" autocomplete="nickname" required />
            </label>

            <label for="songCommentDifficulty">
              <span>难度</span>
              <select id="songCommentDifficulty">
                <option value="">不选择难度</option>
              </select>
            </label>
          </div>

          <label for="songCommentContent">
            <span>评论</span>
            <textarea id="songCommentContent" maxlength="500" rows="4" required></textarea>
          </label>

          <p class="song-comment-status" id="songCommentStatus" aria-live="polite"></p>
          <button class="submit-song-comment" type="submit">发布评论</button>
        </form>
      </div>
    </section>
  </div>

  <script src="./js/api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/account-link.js?v=20260702a"></script>
  <script src="./js/song-pool-data.js?v=20260702b"></script>
  <script src="./js/song-pool.js?v=20260701d"></script>
  <script src="./js/particles.js"></script>
  <script src="./js/site-announcement.js"></script>
</body>
</html>
