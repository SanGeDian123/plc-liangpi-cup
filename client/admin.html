<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLC凉皮杯后台管理</title>

  <link rel="icon" type="image/png" href="./assets/logo1.png">
  <link rel="stylesheet" href="./css/admin.css?v=20260701a">
</head>
<body>

<div id="loginPanel" class="panel">
  <h1>后台登录</h1>

  <div class="form-card">
    <input id="adminPassword" type="password" placeholder="请输入管理员密码">
    <button onclick="adminLogin()">进入后台</button>
    <p id="loginMsg"></p>
  </div>
</div>

<div id="adminPanel" class="panel" style="display:none;">

  <div class="admin-top">
    <h1>排行榜后台管理</h1>
    <div class="admin-actions">
      <a class="logout-btn admin-link-button" href="./schedule-admin">赛程后台</a>
      <button class="logout-btn" onclick="logoutAdmin()">退出登录</button>
    </div>
  </div>

  <div class="form-card">
    <input id="nickname" placeholder="昵称">
    <input id="number" placeholder="编号">
    <input id="score" placeholder="成绩" type="number">

    <button onclick="addPlayer()">新增选手</button>
    <p id="adminMsg" class="admin-msg" aria-live="polite"></p>
  </div>

  <h2>排行榜绑定审核</h2>
  <div id="bindingReviewList" class="binding-review-list"></div>
  <p id="bindingReviewMsg" class="admin-msg" aria-live="polite"></p>

  <h2>选手列表</h2>

  <div id="adminList"></div>

</div>

<div id="adminConfirmDialog" class="admin-dialog" aria-hidden="true">
  <div class="admin-dialog-backdrop" onclick="closeDeleteDialog()"></div>
  <section class="admin-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="adminConfirmTitle">
    <h2 id="adminConfirmTitle">确认删除选手？</h2>
    <p>删除后无法恢复，请确认是否继续。</p>
    <div class="admin-dialog-actions">
      <button type="button" class="ghost-btn" onclick="closeDeleteDialog()">取消</button>
      <button type="button" class="danger" onclick="confirmDeletePlayer()">删除</button>
    </div>
  </section>
</div>

<script src="./js/api.js"></script>
<script src="./js/admin.js?v=20260701c"></script>

</body>
</html>
